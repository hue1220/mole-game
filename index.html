<script>
/* =========================================================
   ★ Firebase 설정 — 여기만 바꾸면 됩니다 ★
   비워두면 "체험 모드"(이 브라우저 안에서만 작동)로 열립니다.

const firebaseConfig = {
  apiKey: "AIzaSyCvi-oMFJ7HVTZt1jEIRRC-hISB1QxCKEk",
  authDomain: "mole-game-f6eec.firebaseapp.com",

const GAME_MS = 30000;          // 게임 시간
const POINTS = { mole:1, gold:3, bomb:-2 };
const COLORS = ['#ff6b6b','#ffa94d','#fcc419','#51cf66','#339af0','#9775fa','#f783ac'];

/* ---------- 도구 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = v => v == null ? null : JSON.parse(JSON.stringify(v));
const LS = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
function rid(n){ const a='abcdefghjkmnpqrstuvwxyz23456789'; let s=''; for (const x of crypto.getRandomValues(new Uint32Array(n))) s+=a[x%a.length]; return s; }
function mulberry32(a){ return () => { a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- 저장소 (Firebase 또는 체험 모드) ---------- */
let DB;
if (firebaseConfig.databaseURL && window.firebase) {
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  DB = {
    demo:false, offset:0,
    on(p, cb){ const r=db.ref(p); const h=s=>cb(s.val()); r.on('value',h); return () => r.off('value',h); },
    get: p => db.ref(p).get().then(s => s.val()),
    set: (p,v) => db.ref(p).set(v),
    update: (p,o) => db.ref(p).update(o),
    remove: p => db.ref(p).remove(),
    transaction: (p, fn) => db.ref(p).transaction(fn),
    presence(p, val){ // 접속 중 표시, 연결 끊기면 online:false
      const ref = db.ref(p), con = db.ref('.info/connected');
      const h = s => { if (s.val()) { ref.onDisconnect().update({ online:false }); ref.update(val()); } };
      con.on('value', h);
      return () => { con.off('value', h); ref.onDisconnect().cancel(); };
    }
  };
  db.ref('.info/serverTimeOffset').on('value', s => { DB.offset = s.val() || 0; });
} else {
  DB = makeDemoDB();
  if (firebaseConfig.databaseURL && !window.firebase) DB.loadError = true;
}
function makeDemoDB(){
  const KEY='mole-demo'; let tree=LS.get(KEY)||{}; const subs=new Set();
  const parts=p=>p.split('/').filter(Boolean);
  const getAt=p=>parts(p).reduce((o,k)=>o==null?undefined:o[k],tree);
  function setAt(p,v){ const ks=parts(p); let o=tree;
    for(let i=0;i<ks.length-1;i++){ if(typeof o[ks[i]]!=='object'||o[ks[i]]===null) o[ks[i]]={}; o=o[ks[i]]; }
    if(v==null) delete o[ks[ks.length-1]]; else o[ks[ks.length-1]]=clone(v); }
  const emit=()=>subs.forEach(s=>s.cb(clone(getAt(s.p)??null)));
  const save=()=>{ LS.set(KEY,tree); emit(); };
  addEventListener('storage',e=>{ if(e.key===KEY){ tree=LS.get(KEY)||{}; emit(); } });
  return { demo:true, offset:0,
    on(p,cb){ const s={p,cb}; subs.add(s); cb(clone(getAt(p)??null)); return ()=>subs.delete(s); },
    get: async p => clone(getAt(p)??null),
    set: async (p,v) => { setAt(p,v); save(); },
    update: async (p,o) => { for(const k in o) setAt(p+'/'+k,o[k]); save(); },
    remove: async p => { setAt(p,null); save(); },
    transaction: async (p, fn) => { const r = fn(clone(getAt(p) ?? null)); if (r !== undefined) { setAt(p, r); save(); } },
    presence(p,val){ const o=val(); for(const k in o) setAt(p+'/'+k,o[k]); save(); return ()=>{}; }
  };
}
const now = () => Date.now() + (DB.offset || 0);

/* ---------- 나 ---------- */
const ME = (() => { let m = LS.get('mg-me');
  if (!m || !m.pid) { m = { pid:rid(10), name:'', color:COLORS[Math.floor(Math.random()*COLORS.length)] }; LS.set('mg-me', m); }
  return m; })();
const saveMe = () => LS.set('mg-me', ME);

/* ---------- 소리 ---------- */
let AC = null;
function ac(){ if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); return AC; }
function unlockAudio(){
  const c = ac(); if (c.state === 'suspended') c.resume();
  if (!c._unlocked) { const b=c.createBuffer(1,1,22050), s=c.createBufferSource(); s.buffer=b; s.connect(c.destination); s.start(0); c._unlocked=true; }
}
addEventListener('pointerdown', unlockAudio, { capture:true });
addEventListener('touchend', unlockAudio, { capture:true });

function tone(type, f1, f2, dur, vol=0.25, delay=0){
  const c=ac(), t=c.currentTime+delay, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+0.02);
}
function noise(dur, vol, f1, f2){
  const c=ac(), t=c.currentTime, n=Math.floor(c.sampleRate*dur), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
  s.buffer=b; f.type='lowpass'; f.frequency.setValueAtTime(f1,t); f.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f).connect(g).connect(c.destination); s.start(t);
}
const SFX = {

/* ---------- 🔒 목소리·사진 잠금 (4자리 비밀번호, 들어갈 때마다 물어봄) ---------- */
const LOCK = { v:null, p:null, vLoaded:false, pLoaded:false, onchange:null,
  get rec(){ return this.v || this.p; }, get ready(){ return this.vLoaded && this.pLoaded; },
  changed(){ if (this.onchange) this.onchange(); } };
async function pinHash(pin, salt){
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('mole|' + salt + '|' + pin));
  return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2,'0')).join('');
}
async function saveLock(pin){
  const salt = rid(12), rec = { lock:true, salt, h: await pinHash(pin, salt), at: now(), wav:'', img:'', kind:'lock' };
  const paths = LOCK.p && !LOCK.v ? ['photos/faces/_lock', 'voices/_lock'] : ['voices/_lock', 'photos/faces/_lock'];
  for (const path of paths) { try { await DB.set(path, rec); return true; } catch(e) {} }
  return false;
}
const PINFAIL = { n:0, until:0 };
// mode: 'auto'(있으면 입력, 없으면 새로 정하기) | 'change'(새 비밀번호로 바꾸기)
function lockGate(title, back, onOpen, mode='auto'){
  let step = null, pin = '', first = '', msg = '', shake = false, busy = false;
  function draw(){
    if (!LOCK.ready) { paint(`${header(`<button class="link" id="back">← 돌아가기</button>`)}<div class="lockwrap"><div class="lockico">🔒</div><p class="sub">잠깐만요, 불러오는 중…</p></div>`);
      $('#back').onclick = () => location.hash = back ? 'r='+back : ''; return; }
    if (!step) step = (mode === 'change' || !LOCK.rec) ? 'new' : 'enter';
    const t = step === 'enter' ? '비밀번호 4자리를 눌러 주세요'
      : step === 'new' ? (mode === 'change' ? '새 비밀번호 4자리를 정해 주세요' : '처음이에요! 가족 비밀번호 4자리를 정해 주세요')
      : '확인을 위해 한 번 더 눌러 주세요';
    const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
    paint(`${header(`<button class="link" id="back">← 돌아가기</button>`)}
      <div class="lockwrap"><div class="lockico">🔒</div><h1 style="margin-top:8px">${esc(title)}</h1><p class="sub">${t}</p>
      <div class="pindots ${shake?'shake':''}">${[0,1,2,3].map(i=>`<i class="${i<pin.length?'on':''}"></i>`).join('')}</div>
      ${msg ? `<div class="msg ${msg.startsWith('!')?'err':'info'}">${esc(msg.replace(/^!/,''))}</div>` : ''}
      <div class="pad">${keys.map(k=>`<button data-k="${k}" class="${k===''?'blank':''}">${k}</button>`).join('')}</div>
      <p class="sub" style="margin-top:16px;font-size:12px">녹음·사진은 가족만 바꿀 수 있어요. 게임은 누구나 할 수 있어요.</p></div>`);
    shake = false;

    document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => press(b.dataset.k));
  }
  async function press(k){
    if (busy || !k) return;
    if (k === '⌫') { pin = pin.slice(0, -1); return draw(); }
    if (pin.length >= 4) return;
    pin += k; draw();
    if (pin.length < 4) return;
    busy = true;
    if (step === 'enter') {
      if (Date.now() < PINFAIL.until) { msg = `!너무 많이 틀렸어요. ${Math.ceil((PINFAIL.until-Date.now())/1000)}초 뒤에 다시 해 주세요.`; pin=''; shake=true; busy=false; return draw(); }
      const r = LOCK.rec;
      if (await pinHash(pin, r.salt) === r.h) { PINFAIL.n = 0; busy=false; return open(); }
      PINFAIL.n++; if (PINFAIL.n >= 5) { PINFAIL.until = Date.now() + 30000; PINFAIL.n = 0; }
      msg = '!비밀번호가 달라요.'; pin=''; shake=true; busy=false; return draw();
    }
    if (step === 'new') { first = pin; pin = ''; step = 'again'; msg = ''; busy=false; return draw(); }
    if (pin !== first) { msg = '!두 번 누른 번호가 달라요. 처음부터 다시 정해 주세요.'; pin=''; first=''; step='new'; shake=true; busy=false; return draw(); }
    const ok = await saveLock(pin); busy = false;
    if (!ok) { msg = '!비밀번호를 저장하지 못했어요. 인터넷 연결을 확인해 주세요.'; pin=''; first=''; step='new'; return draw(); }
    open(mode === 'change' ? '비밀번호를 바꿨어요.' : '비밀번호를 정했어요. 다음부터 이 번호로 들어와요.');
  }
  function open(note){ LOCK.onchange = null; onOpen(note); }
  LOCK.onchange = () => { if (!step) draw(); };
  cleanups.push(() => { LOCK.onchange = null; });
  draw();
}

function b64ToBytes(b64){ const s=atob(b64), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
function bytesToB64(u){ let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
function decodeAB(ab){ return new Promise((res,rej)=>{ const p=ac().decodeAudioData(ab,res,rej); if(p&&p.then) p.then(res,rej); }); }
DB.on('voices', v => {
  v = Object.assign({}, v || {});

  }

});
function playBuffer(b, done){
  const c=ac(), s=c.createBufferSource(), g=c.createGain(); g.gain.value=1.4;
  s.buffer=b; s.connect(g).connect(c.destination); s.onended=done; s.start();
}

  if (!list.length) return false;

// 녹음 → 16kHz 모노 WAV (아이폰·안드로이드 모두 재생되도록)
function toWav(buf){
  const sr=16000, ch=buf.numberOfChannels, len=buf.length, mono=new Float32Array(len);
  for(let c=0;c<ch;c++){ const d=buf.getChannelData(c); for(let i=0;i<len;i++) mono[i]+=d[i]/ch; }
  const th=0.02; let s=0, e=len-1;
  while(s<len && Math.abs(mono[s])<th) s++;
  while(e>s && Math.abs(mono[e])<th) e--;
  if (e-s < buf.sampleRate*0.15) return null;
  s=Math.max(0,s-Math.floor(buf.sampleRate*0.04)); e=Math.min(len-1,e+Math.floor(buf.sampleRate*0.12));
  let peak=0; for(let i=s;i<=e;i++) peak=Math.max(peak,Math.abs(mono[i]));
  const gain=Math.min(5,0.92/peak), ratio=buf.sampleRate/sr, n=Math.floor((e-s)/ratio);
  const out=new DataView(new ArrayBuffer(44+n*2));
  const w=(o,str)=>{ for(let i=0;i<str.length;i++) out.setUint8(o+i,str.charCodeAt(i)); };
  w(0,'RIFF'); out.setUint32(4,36+n*2,true); w(8,'WAVE'); w(12,'fmt '); out.setUint32(16,16,true);
  out.setUint16(20,1,true); out.setUint16(22,1,true); out.setUint32(24,sr,true); out.setUint32(28,sr*2,true);
  out.setUint16(32,2,true); out.setUint16(34,16,true); w(36,'data'); out.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){ const p=s+i*ratio, i0=Math.floor(p), f=p-i0;
    let v=(mono[i0]*(1-f)+(mono[i0+1]||0)*f)*gain; v=Math.max(-1,Math.min(1,v)); out.setInt16(44+i*2,v*32767,true); }
  return new Uint8Array(out.buffer);
}

function makeSchedule(seed, level){
  const L = LEVELS[level] || LEVELS.normal;
  const r = mulberry32(seed), ev = [], busy = Array(9).fill(0);
  let t = 250;
  while (t < GAME_MS - 500) {
    const p = t / GAME_MS;
    const d = L.d0 - L.dDrop*p + r()*L.dR;
    let h = -1;
    for (let k=0;k<12;k++){ const c=Math.floor(r()*9); if (busy[c] <= t) { h=c; break; } }
    if (h >= 0) {
      const x = r(), type = x < L.gold ? 'gold' : x < L.gold + L.bomb ? 'bomb' : 'mole';
      const dd = type==='gold' ? d*0.72 : d;
      ev.push({ t, h, type, d:dd }); busy[h] = t + dd + 150;
    }
    t += L.g0 - L.gDrop*p + r()*L.gR;
  }
  return ev;
}

function roomView(code){
  if (!ME.name) { location.hash=''; return; }
  const path = 'rooms/'+code;
  const R = { code, data:null, view:null, round:null, ev:null, hits:new Map(), score:0, raf:0, lastCount:null, ended:false };
  cleanups.push(DB.presence(path+'/players/'+ME.pid, () => ({ name:ME.name, color:ME.color, online:true, joinedAt:now() })));
  cleanups.push(() => { R.loopId = (R.loopId || 0) + 1; cancelAnimationFrame(R.raf); });
  // 안전장치: 화면이 멈춘 것처럼 보이면(애니메이션이 끊기면) 0.5초마다 직접 화면을 다시 그려줌
  const watchdog = setInterval(() => {
    if (!R.data) return;
    if (R.view === 'game' && Date.now() - (R.lastFrame || 0) > 700) frame();
    else if (R.view !== want()) render();
  }, 500);
  cleanups.push(() => clearInterval(watchdog));
  const onVis = () => { if (!document.hidden && R.data) render(); };
  document.addEventListener('visibilitychange', onVis);
  cleanups.push(() => document.removeEventListener('visibilitychange', onVis));

  const players = () => Object.entries((R.data && R.data.players) || {}).map(([pid,p]) => ({ pid, ...p }));
  const elapsed = () => now() - R.data.startAt;

  function want(){
    const d = R.data;
    if (!d) return 'none';
    if (d.state === 'playing' && d.startAt) return elapsed() < GAME_MS + 1600 ? 'game' : 'result';
    return 'lobby';
  }
  function render(){
    const w = want();
    if (w === 'game' && R.view === 'game' && R.round === R.data.round && R.seed === R.data.seed) { drawChips(); return; }
    R.view = w;
    if (w === 'none') { paint(`${header()}<div class="msg err">방이 없어졌어요.</div><div style="height:10px"></div><button class="btn ghost" id="home">처음으로</button>`); $('#home').onclick=()=>location.hash=''; return; }
    if (w === 'lobby') return lobby();
    if (w === 'game') return game();
    return result();
  }

  function startRound(){
    // 이미 진행 중인 판이 있으면 무시 (두 명이 거의 동시에 눌러도 한 번만 시작)
    const d = R.data || {};
    if (d.state === 'playing' && d.startAt && now() - d.startAt < GAME_MS + 1600) return;
    if (R.starting && Date.now() - R.starting < 3000) return;
    R.starting = Date.now();
    // 방 전체를 한 번에 덮어쓰지 않고 필요한 칸만 고침 (Firebase 규칙이 칸 단위라 통째로 쓰면 거부됨)
    DB.update(path, { state:'playing', round:(d.round||0)+1, level:d.level||'normal', playLevel:d.level||'normal',
                      seed:Math.floor(Math.random()*2**31), startAt:now()+3800 });
  }
  function leave(){ DB.remove(path+'/players/'+ME.pid); location.hash=''; }

  /* --- 대기실 --- */
  function lobby(){
    const ps = players().filter(p => p.online !== false);
    const vc = Object.keys(V.raw).length, lv = R.data.level || 'normal';
    paint(`${header('<button class="link" id="out">나가기</button>')}
      <div class="card" style="text-align:center"><p class="sub">방 번호 · 가족에게 알려주세요</p><div class="bigcode">${esc(code)}</div>
        <div class="qrbox"><div id="qr"></div><p class="sub">처음 하는 사람은 QR을 찍어 게임을 열고<br>방 번호 <b>${esc(code)}</b>을 입력하세요</p></div></div>
      <div class="card"><h2>들어온 사람 · ${ps.length}명</h2>
        <div class="plist">${ps.map(p=>`<div class="pl" style="--c:${p.color}"><span class="dot"></span>${esc(p.name)} ${p.pid===ME.pid?'<span class="me">(나)</span>':''}</div>`).join('')}</div>
        <label class="f">난이도</label>
        <div class="seg">${Object.entries(LEVELS).map(([k,L])=>`<button data-lv="${k}" class="${k===lv?'on':''}">${L.emoji} ${L.name}</button>`).join('')}</div>
        <div style="height:14px"></div><button class="btn" id="go">시작! (30초 · ${LEVELS[lv].name})</button>
        <p class="sub" style="text-align:center;margin-top:10px">모두 들어오면 아무나 시작을 누르세요</p></div>
      <div style="text-align:center;margin-top:16px"><button class="link" id="voice">🔒 🎤 목소리 ${vc}개 · 녹음하러 가기</button>
        <span class="sub"> · </span><button class="link" id="photo">🔒 📷 황금 두더지 얼굴</button></div>`);
    if (window.QRCode) new QRCode($('#qr'), { text: location.origin + location.pathname, width:150, height:150 });
    $('#go').onclick = startRound;
    $('#out').onclick = leave;
    $('#voice').onclick = () => location.hash = 'v&r='+code;
    $('#photo').onclick = () => location.hash = 'p&r='+code;
    document.querySelectorAll('[data-lv]').forEach(b => b.onclick = () => DB.update(path, { level:b.dataset.lv }));
  }

  /* --- 게임 --- */
  function game(){
    const d = R.data;
    R.round = d.round; R.seed = d.seed; R.ev = makeSchedule(d.seed, d.playLevel);
    P.current = P.list.length ? P.list[d.seed % P.list.length].img : null;   // 판마다 얼굴 하나 (모두 같은 얼굴)
    R.hits = new Map(); R.score = 0; R.lastCount = null; R.ended = false;   // 새 판: 점수·맞힌 기록 초기화
    R.byHole = Array.from({length:9}, () => []);
    R.ev.forEach((e,i) => R.byHole[e.h].push(i));
    DB.update(path+'/players/'+ME.pid, { score:0, round:d.round });
    paint(`<div class="hud"><div class="timebar"><i id="tb" style="width:100%"></i></div><div class="secs" id="secs">30</div></div><div class="lvtag">${LEVELS[d.playLevel||'normal'].emoji} ${LEVELS[d.playLevel||'normal'].name}</div>
      <div class="chips" id="chips"></div>
      <div class="board" id="board"><div class="grid">${Array.from({length:9},(_,i)=>`<div class="hole" data-h="${i}"><div class="pit"></div><div class="win"><div class="mole"></div></div><div class="lip"></div></div>`).join('')}</div></div>`);
    R.holes = [...document.querySelectorAll('.hole')].map(el => ({ el, mole:el.querySelector('.mole'), cur:-1, cls:'' }));
    R.holes.forEach((H,i) => H.el.addEventListener('pointerdown', e => { e.preventDefault(); tap(i, e); }));
    drawChips();
    cancelAnimationFrame(R.raf);
    const token = R.loopId = (R.loopId || 0) + 1;   // 이전 판의 반복이 남아 겹치지 않게
    const loop = () => { if (token !== R.loopId) return; frame(); if (R.view === 'game' && token === R.loopId) R.raf = requestAnimationFrame(loop); };
    R.raf = requestAnimationFrame(loop);
  }
  function activeEvent(h, el){
    for (const i of R.byHole[h]) { const e = R.ev[i]; if (el >= e.t && el < e.t + e.d) return i; if (e.t > el) break; }
    return -1;
  }
  function frame(){
    R.lastFrame = Date.now();
    const el = elapsed(), ov = $('#overlay'), ovt = $('#ovt');
    // 카운트다운
    if (el < 0) {
      const n = Math.min(3, Math.ceil(-el/1000));
      ov.classList.remove('hide'); ovt.textContent = n;
      if (R.lastCount !== n) { R.lastCount = n; SFX.beep(false); }
    } else if (el < 600) {
      ov.classList.remove('hide'); ovt.textContent = '시작!';
      if (R.lastCount !== 0) { R.lastCount = 0; SFX.beep(true); }
    } else if (el >= GAME_MS) {
      ov.classList.remove('hide'); ovt.textContent = '끝!';
      if (!R.ended) { R.ended = true; SFX.end(); }
    } else ov.classList.add('hide');
    // 시간
    const left = Math.max(0, Math.min(GAME_MS, GAME_MS - el));
    const tb = $('#tb'), sc = $('#secs');
    if (tb) tb.style.width = (left/GAME_MS*100) + '%';
    if (sc) sc.textContent = Math.ceil(left/1000);
    // 두더지
    R.holes.forEach((H,h) => {
      let cls = '', idx = -1;
      const hitIdx = [...R.hits.entries()].find(([i,at]) => R.ev[i].h===h && el < at + 320);
      if (hitIdx) { idx = hitIdx[0]; cls = 'hit'; }
      else { idx = el >= 0 && el < GAME_MS ? activeEvent(h, el) : -1; if (idx >= 0 && !R.hits.has(idx)) cls = 'up'; else idx = -1; }
      if (idx !== H.cur) { H.cur = idx; if (idx >= 0) H.mole.innerHTML = R.ev[idx].type==='bomb' ? BOMB : moleSVG(R.ev[idx].type); }
      if (cls !== H.cls) { H.cls = cls; H.el.classList.toggle('up', cls==='up'); H.el.classList.toggle('hit', cls==='hit'); }
    });
    if (el >= GAME_MS + 1600) render();
  }
  function tap(h, e){
    const el = elapsed();
    if (el < 0 || el >= GAME_MS) return;
    showHammer(e.clientX, e.clientY);
    const i = activeEvent(h, el);
    const hole = R.holes[h].el;
    if (i >= 0 && !R.hits.has(i)) {
      R.hits.set(i, el);
      const type = R.ev[i].type, pts = POINTS[type];
      R.score += pts;
      DB.update(path+'/players/'+ME.pid, { score:R.score, round:R.round });
      floatText(hole, (pts>0?'+':'')+pts, type==='bomb' ? '#e5484d' : type==='gold' ? '#e0a800' : '#16a36a');
      if (type === 'bomb') { SFX.bomb(); const b=document.createElement('div'); b.className='boom'; hole.appendChild(b); setTimeout(()=>b.remove(),500);
        const bd=$('#board'); bd.classList.remove('shake'); void bd.offsetWidth; bd.classList.add('shake'); }
      else if (type === 'gold') { SFX.bonk(); SFX.gold(); setTimeout(() => playVoice('gold'), 120); }
      else SFX.bonk();
    } else {
      floatText(hole, '헛방!', '#8a8f9c');
      tease();
    }
  }
  function showHammer(x, y){
    const d = document.createElement('div'); d.className = 'hammer'; d.innerHTML = HAMMER;
    d.style.left = x+'px'; d.style.top = y+'px'; document.body.appendChild(d); setTimeout(() => d.remove(), 260);
  }
  function floatText(hole, txt, color){
    const f = document.createElement('div'); f.className='float'; f.textContent=txt; f.style.color=color;
    hole.appendChild(f); setTimeout(() => f.remove(), 720);
  }
  function drawChips(){
    const box = $('#chips'); if (!box) return;
    const ps = players().filter(p => p.round === R.round || p.pid === ME.pid)
      .map(p => ({ ...p, s: p.pid===ME.pid ? R.score : (p.round===R.round ? p.score||0 : 0) })).sort((a,b) => b.s - a.s);
    box.innerHTML = ps.map(p => `<span class="chip ${p.pid===ME.pid?'mine':''}" style="--c:${p.color}"><span class="dot"></span>${esc(p.name)} <b>${p.s}</b></span>`).join('');
  }

  /* --- 결과 --- */
  function result(){
    $('#overlay').classList.add('hide');
    const d = R.data, lv = d.playLevel || 'normal';
    const ps = players().filter(p => p.round === d.round).sort((a,b) => (b.score||0) - (a.score||0));
    const medals = ['🥇','🥈','🥉'], heights = [150,110,80];
    const order = ps.length >= 3 ? [1,0,2] : ps.length === 2 ? [1,0] : [0];
    paint(`${header('<button class="link" id="out">나가기</button>')}
      <div style="text-align:center;margin-top:8px"><h1>${ps.length ? esc(ps[0].name)+' 승리! 🎉' : '게임 끝!'}</h1><p class="sub">${LEVELS[d.playLevel||'normal'].emoji} ${LEVELS[d.playLevel||'normal'].name} 난이도</p></div>
      <div class="podium">${order.filter(i=>ps[i]).map(i => `<div class="pod" style="--c:${ps[i].color}">
        <div class="medal">${medals[i]}</div><div class="nm">${esc(ps[i].name)}</div><div class="sc">${ps[i].score||0}점</div>
        <div class="bar" style="height:${heights[i]}px">${i+1}</div></div>`).join('')}</div>
      ${ps.length > 3 ? `<div class="card"><div class="plist">${ps.slice(3).map((p,k)=>`<div class="pl" style="--c:${p.color}"><span class="dot"></span>${k+4}등 ${esc(p.name)} <span style="margin-left:auto">${p.score||0}점</span></div>`).join('')}</div></div>` : ''}
      <div id="newrec"></div>
      <div class="card"><h2>🏆 ${LEVELS[lv].emoji} ${LEVELS[lv].name} 최고 기록 10</h2><div class="plist" id="ranklist"><p class="sub">불러오는 중…</p></div></div>
      <div style="height:16px"></div>
      <button class="btn" id="again">한 판 더! (같은 난이도)</button>
      <div style="height:10px"></div><button class="btn ghost" id="lobby">난이도 바꾸기</button>
      <div style="text-align:center;margin-top:16px"><button class="link" id="voice">🔒 🎤 목소리 녹음</button></div>`);
    // 내 기록 저장 (한 판에 한 번만)
    const me = ps.find(p => p.pid === ME.pid);
    const rkey = code+'-'+d.round;
    if (me && (me.score||0) > 0 && R.rankSaved !== rkey) {
      R.rankSaved = rkey;
      DB.set(RANK+lv+'/'+rkey+'-'+ME.pid, { name:ME.name, color:ME.color, score:me.score, at:now(), pid:ME.pid }).catch(e => window.__showErr && __showErr('기록 저장 실패: '+e.message));
    }
    if (R.rankOff) R.rankOff();
    R.rankOff = DB.on(RANK+lv, v => {
      const list = rankList(v), el = $('#ranklist'), nr = $('#newrec');
      if (!el || !nr || R.view !== 'result') return;
      el.innerHTML = rankHTML(list, rkey+'-'+ME.pid);
      const i = list.findIndex(r => r.id === rkey+'-'+ME.pid);
      nr.innerHTML = i >= 0 ? `<div class="newrec">🏆 ${esc(ME.name)} ${i+1}위 기록! (${me.score}점)</div>` : '';
    });
    cleanups.push(() => { if (R.rankOff) R.rankOff(); R.rankOff = null; });
    $('#again').onclick = startRound;
    $('#lobby').onclick = () => DB.update(path, { state:'lobby' });
    $('#out').onclick = leave;
    $('#voice').onclick = () => location.hash = 'v&r='+code;
  }

  cleanups.push(DB.on(path, d => { R.data = d; render(); }));
}

/* ================= 황금 두더지 사진 ================= */
function photoView(back, note){
  let msg = note || '';
  function draw(){
    const L = P.list;
    paint(`${header(`<button class="link" id="back">← 돌아가기</button>`)}
      <div style="text-align:center;margin-top:10px"><h1>황금 두더지 얼굴</h1>
      <p class="sub">판마다 이 중 한 얼굴이 무작위로 황금 두더지가 돼요! (+3점)<br>얼굴이 가운데 오도록 자른 사진이 좋아요.</p></div>
      ${L.length ? `<div class="faces">${L.map(x=>`<div class="facecell"><div class="facebox">${goldFaceSVG(x.img)}</div><button class="btn ghost small" data-del="${esc(x.path)}">지우기</button></div>`).join('')}</div>`
        : `<div class="facebox" style="width:160px;height:160px">${moleSVG('mole').replace('<svg','<svg style="filter:sepia(1) saturate(4) hue-rotate(-10deg)"')}</div><p class="sub" style="text-align:center">아직 얼굴이 없어서 원래 황금 두더지가 나와요.</p>`}
      ${msg ? `<div class="msg ${msg.startsWith('!')?'err':'info'}" style="text-align:center">${esc(msg.replace(/^!/,''))}</div>` : ''}
      <label class="btn" style="margin-top:14px">📷 얼굴 사진 추가 (여러 장 선택 가능)<input id="file" type="file" accept="image/*" multiple hidden></label>
      <p class="sub" style="text-align:center;margin-top:14px">사진은 이 게임 저장소(Firebase)에만 저장돼요. 최대 6장.</p>
      <div style="text-align:center;margin-top:10px"><button class="link" id="chpin">🔑 비밀번호 바꾸기</button></div>`);
    $('#chpin').onclick = () => { reset(); lockGate('비밀번호 바꾸기', back, n => photoView(back, n), 'change'); };
    $('#back').onclick = () => location.hash = back ? 'r='+back : '';
    $('#file').onchange = async e => {
      const files = [...e.target.files].slice(0, Math.max(0, 6 - P.list.length));
      if (!files.length) { msg = '!얼굴은 6장까지예요. 하나를 지우고 추가해 주세요.'; return draw(); }
      let ok = 0; for (const f of files) { if (await save(f)) ok++; }
      msg = ok ? `${ok}장 저장했어요! 가족 모두의 게임에 나와요.` : '!저장하지 못했어요. Firebase 규칙에 photos가 있는지 확인해 주세요.';
      draw();
    };
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { if (confirm('이 얼굴을 지울까요?')) DB.remove(b.dataset.del); });
  }
  function save(file){
    return new Promise(res => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = async () => {
        const side = Math.min(img.naturalWidth, img.naturalHeight), size = 220;
        const cv = document.createElement('canvas'); cv.width = cv.height = size;
        const cx = cv.getContext('2d'); cx.fillStyle = '#fff6d6'; cx.fillRect(0,0,size,size);
        cx.drawImage(img, (img.naturalWidth-side)/2, (img.naturalHeight-side)/2, side, side, 0, 0, size, size);
        URL.revokeObjectURL(url);
        try { await DB.set('photos/faces/'+rid(8), { img: cv.toDataURL('image/jpeg', 0.85), by: ME.name||'', at: now() }); res(true); }
        catch(e) { res(false); }
      };
      img.onerror = () => res(false);
      img.src = url;
    });
  }
  P.onchange = draw;
  cleanups.push(() => { P.onchange = null; });
  draw();
}

/* ================= 목소리 녹음 ================= */
function voiceView(back, note){
  const S = { rec:null, stream:null, timer:0, msg:note||'', kind:'tease' };
  const KINDS = { tease:{ tab:'😜 놀리는 목소리', help:'빈 구멍을 때리면 여기 목소리 중 하나가 나와요.', none:'없으면 기본 "삐융~" 소리가 나요' },
                  gold:{ tab:'👑 황금 두더지 목소리', help:'황금 두더지를 잡으면 여기 목소리 중 하나가 나와요.', none:'없으면 반짝 효과음만 나요' } };
  function draw(){
    const K = KINDS[S.kind];
    const list = Object.entries(V.raw).filter(([id]) => kindOf(id) === S.kind).sort((a,b) => (a[1].at||0) - (b[1].at||0));
    paint(`${header(`<button class="link" id="back">← 돌아가기</button>`)}
      <div class="seg" style="margin-top:6px">${Object.entries(KINDS).map(([k,x])=>`<button data-kind="${k}" class="${k===S.kind?'on':''}">${x.tab}</button>`).join('')}</div>
      <div style="text-align:center;margin-top:12px">
      <p class="sub">${K.help}<br>최대 3초, 크게 또박또박!</p></div>
      <button class="rec ${S.rec?'on':''}" id="rec">${MIC}${S.rec?'녹음 중… (멈추기)':'녹음하기'}</button>
      ${S.msg ? `<div class="msg ${S.msg.startsWith('!')?'err':'info'}" style="text-align:center">${esc(S.msg.replace(/^!/,''))}</div>` : ''}
      <div class="card"><h2>저장된 목소리 · ${list.length}개</h2>
        ${list.length ? `<div class="vlist">${list.map(([id,x],k)=>`<div class="vi"><span>목소리 ${k+1} <small>${esc(x.by||'')}</small></span>
          <button class="btn ghost small" data-play="${id}">▶ 듣기</button><button class="btn ghost small" data-del="${id}">삭제</button></div>`).join('')}</div>`
          : `<p class="sub">아직 없어요. 녹음해 보세요! (${K.none})</p>`}</div>
      <div style="text-align:center;margin-top:10px"><button class="link" id="chpin">🔑 비밀번호 바꾸기</button></div>`);
    $('#chpin').onclick = () => { if (S.rec) return; stop(true); reset(); lockGate('비밀번호 바꾸기', back, n => voiceView(back, n), 'change'); };
    document.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => { if (S.rec) return; S.kind = b.dataset.kind; S.msg=''; draw(); });
    $('#back').onclick = () => { stop(true); location.hash = back ? 'r='+back : ''; };
    $('#rec').onclick = () => S.rec ? stop() : start();
    document.querySelectorAll('[data-play]').forEach(b => b.onclick = () => { const x=V.buf[b.dataset.play]; if (x && x!=='loading') playBuffer(x, ()=>{}); });
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { if (confirm('이 목소리를 지울까요?')) DB.remove('voices/'+b.dataset.del); });
  }
  async function start(){
    if (!navigator.mediaDevices || !window.MediaRecorder) { S.msg='!이 기기에서는 녹음을 지원하지 않아요.'; return draw(); }
    if (voiceCount(S.kind) >= 10) { S.msg='!목소리는 10개까지예요. 하나를 지우고 녹음해 주세요.'; return draw(); }
    try { S.stream = await navigator.mediaDevices.getUserMedia({ audio:true }); }
    catch(e) { S.msg='!마이크 사용을 허용해 주세요. (설정 → Safari/Chrome → 마이크)'; return draw(); }
    const chunks = [];
    S.rec = new MediaRecorder(S.stream);
    S.rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    S.rec.onstop = async () => {
      S.stream.getTracks().forEach(t => t.stop());
      if (S.cancel) return;
      try {
        const ab = await new Blob(chunks, { type: S.rec.mimeType || 'audio/mp4' }).arrayBuffer();
        const buf = await decodeAB(ab);
        const wav = toWav(buf);
        S.rec = null;
        if (!wav) { S.msg='!소리가 너무 작아요. 조금 더 크게 다시 녹음해 주세요.'; return draw(); }
        await DB.set('voices/'+rid(8), { wav:bytesToB64(wav), by:ME.name||'', at:now(), kind:S.kind });
        S.msg = '저장했어요! 가족 모두의 게임에서 나와요.';
      } catch(e) { S.rec = null; S.msg="!녹음을 저장하지 못했어요. 다시 해주세요."; }
      draw();
    };
    S.cancel = false; S.msg = ''; S.rec.start();
    S.timer = setTimeout(() => stop(), 3000);
    draw();
  }
  function stop(cancel){
    clearTimeout(S.timer);
    if (S.rec && S.rec.state === 'recording') { S.cancel = !!cancel; S.rec.stop(); }
    else if (cancel && S.stream) S.stream.getTracks().forEach(t => t.stop());
  }
  V.onchange = draw;
  cleanups.push(() => stop(true));
  draw();
}

route();
</script>
